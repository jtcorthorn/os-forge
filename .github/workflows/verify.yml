name: Verify neutral OS Forge package
on:
  push:
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '17 */12 * * *'
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-extraction.txt
      - run: python -B -m unittest discover -s scripts -p 'test_*.py'
      - run: python -B scripts/build_sync_bundle.py --source . --output /tmp/os-forge-verified
